# A disposable branch preview. No host writing folders are mounted.
name: still-threads-preview
services:
  still:
    image: still-threads-preview:local
    build: .
    ports:
      - "127.0.0.1:${STILL_PREVIEW_PORT:-4097}:4000"
    environment:
      DATABASE_PATH: /app/data/still.db
      STILL_LOCAL_STATE_DIRECTORY: /app/data/local-state
      STILL_THREADS_PREVIEW: "true"
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4000"
    volumes:
      - preview-data:/app/data
      - ./scripts/seed_threads_preview.exs:/app/preview/seed.exs:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:4000/healthz"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 15
volumes:
  preview-data:
